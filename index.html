<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperatura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Conversor de grados</h1>
    
    <div id="padre">
            <section>
                <h2>Ingresa la temperatura en grados celcius</h2>
                <input type="text" name="temperatura" id="temperatura" placeholder="Ingrese la temperatura">
                <button id="convertir">Convertir</button>
                <p id="error"></p>
            </section>
            <section id="valores">
                <div class="fahren">
                    <h3>temperatura en ° fahrenheit</h3>
                    <P id="fahrenheit"></P>
                </div>
                <div class="kelvin">
                    <h3>Temperatura en ° kelvin</h3>
                    <p id="kelvin"></p>
                </div>
            </section>
    </div>


    <script src="script.js"></script>
</body>
</html>
